# Next.js on Netlify — OpenNext adapter is applied automatically.
# Do NOT set publish = ".next" or SPA redirects.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

